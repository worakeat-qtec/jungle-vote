                const contestantsRef = collection(db, 'jungle_data', 'public', 'contestants');
                const votesRef = collection(db, 'jungle_data', 'public', 'votes');

                // Seed default data only if DB is completely empty

                    for (const c of defaultContestants) {
                        await setDoc(doc(contestantsRef, c.id.toString()), c);
                    }
                }

                // Listen to changes
                onSnapshot(contestantsRef, (snapshot) => {

                onSnapshot(votesRef, (snapshot) => {
                    window.state.votes = [];
                    window.state.votedUsers.clear();
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        window.state.votes.push(data);
                        window.state.votedUsers.add(data.voter);

        window.validateForm = function() {
            const inputs = document.querySelectorAll('.score-input');
            const btnSubmit = document.getElementById('btnSubmitVote');
            const statusText = document.getElementById('completionStatus');

            let filledCount = 0;
            const totalRequired = window.state.contestants.length * window.CRITERIA.length;

            inputs.forEach(input => {
                const val = parseInt(input.value);
                if (input.value !== '') filledCount++;
                if (!input.value || isNaN(val) || val < 1 || val > 10) {
                    isValid = false;
                    input.classList.remove('border-green-500', 'bg-green-50', 'text-green-700');
                } else {
                    input.classList.add('border-green-500', 'bg-green-50', 'text-green-700');

            if (isValid) {
                btnSubmit.disabled = false;

                statusText.classList.remove('text-green-600');
            }
        }

        function updateAdminChart() {
            let aggregatedScores = {}; 
            window.state.contestants.forEach(c => {
                aggregatedScores[c.id] = { c1:0, c2:0, c3:0, c4:0, total: 0 };
            });

            let totalScoresInSystem = 0;
            window.state.votes.forEach(v => {
                Object.keys(v.scores).forEach(cId => {
                    if (aggregatedScores[cId]) {
                        window.CRITERIA.forEach(crit => {
                            const score = v.scores[cId][crit.id] || 0;
                            aggregatedScores[cId][crit.id] += score;
                            aggregatedScores[cId].total += score;
                            totalScoresInSystem += score;
                        });
                    }
                });
            });

            document.getElementById('statTotalVoters').innerText = window.state.votedUsers.size;
            document.getElementById('statTotalContestants').innerText = window.state.contestants.length;
            document.getElementById('statTotalScores').innerText = totalScoresInSystem.toLocaleString();

            const labels = window.state.contestants.map(c => c.name);
            const datasets = window.CRITERIA.map((crit, index) => {
                const colors = ['#64c28c', '#3fa36c', '#266844', '#1c442f']; 
                return {
                    label: crit.name,
                    data: window.state.contestants.map(c => aggregatedScores[c.id][crit.id]),
                    backgroundColor: colors[index % colors.length],
                    borderWidth: 0
                };
            });

            Chart.register(ChartDataLabels);
            const ctx = document.getElementById('resultsChart').getContext('2d');
            
            if (window.myChart) window.myChart.destroy();

            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true, beginAtZero: true }
                    },
                    plugins: {
                        tooltip: { mode: 'index', intersect: false },
                        legend: { position: 'bottom' },
                        datalabels: {
                            color: '#1f2937',
                            font: { weight: 'bold', size: 14 },
                            formatter: (value, context) => {
                                if (context.datasetIndex === context.chart.data.datasets.length - 1) {
                                    let total = 0;
                                    for (let i = 0; i < context.chart.data.datasets.length; i++) {
                                        total += context.chart.data.datasets[i].data[context.dataIndex];
                                    }
                                    return total;
                                } else return ''; 
                            },
                            anchor: 'end',
                            align: 'top',
                            offset: 4
                        }
                    }
                }
            });
        }

        // --- Image Compression ---
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 500; 
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_SIZE) {
                        height *= MAX_SIZE / width;
                        width = MAX_SIZE;
                    } else if (height > MAX_SIZE) {
                        width *= MAX_SIZE / height;
                        height = MAX_SIZE;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.6)); 
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

                    }
                    window.closeEditModal();
                    window.showModal('สำเร็จ', 'อัปเดตข้อมูลผู้เข้าประกวดเรียบร้อยแล้ว');
                } catch (e) {
                    console.error(e);
                    window.showModal('ผิดพลาด', 'เซฟข้อมูลไม่สำเร็จ', true);
                } finally {
                    btnText.innerText = "บันทึกข้อมูล";
                    btnIcon.className = "fas fa-save";
                }
            };

            const file = fileInput.files[0];
            if (file) {
                compressImage(file, doSave);
            } else {
                doSave(contestant.image); 
            }
        }

        // --- Voter Management ---
        window.openVoterListModal = function() {
            renderVoterList();
            document.getElementById('voterListModal').classList.remove('hidden');
        }
        window.closeVoterListModal = () => document.getElementById('voterListModal').classList.add('hidden');

        function renderVoterList() {
            const container = document.getElementById('voterListContainer');
            container.innerHTML = '';
            if (window.state.votedUsers.size === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 my-8">ยังไม่มีผู้โหวตในระบบ</p>';
                return;
            }
            const ul = document.createElement('ul');
            ul.className = 'divide-y divide-gray-100';
            Array.from(window.state.votedUsers).forEach(username => {
                const li = document.createElement('li');
                li.className = 'py-3 flex justify-between items-center';
                li.innerHTML = `
                    <div class="flex items-center">
                        <div class="h-10 w-10 rounded-full bg-jungle-100 text-jungle-600 flex items-center justify-center font-bold mr-3 uppercase text-lg border border-jungle-200 shadow-sm">
                            ${username.charAt(0)}
                        </div>
                        <span class="font-medium text-gray-800 text-lg">${username}</span>
                    </div>
                    <button onclick="deleteVoter('${username}')" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg transition-colors flex items-center gap-2 text-sm shadow-sm" title="ลบข้อมูลการโหวตนี้">
                        <i class="fas fa-trash-alt"></i> ลบ
                    </button>
                `;
                ul.appendChild(li);
            });
            container.appendChild(ul);
        }

        window.deleteVoter = async function(username) {
            if(confirm(`ต้องการลบผลโหวตของ "${username}" ใช่หรือไม่? พนักงานจะสามารถโหวตใหม่ได้`)) {
                try {
                    if (db && user) {
                        await deleteDoc(doc(db, 'jungle_data', 'public', 'votes', username));
                    }
                } catch(e) {
                    console.error(e);
                    window.showModal('ผิดพลาด', 'ลบข้อมูลไม่สำเร็จ', true);
                }
            }
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            initDatabase();
            
            // Enter key support for login
            document.getElementById('loginUsername').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') window.startVoting();
            });
            document.getElementById('adminPassword').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') window.verifyAdmin();
            });
        });

    </script>
</body>
</html>
